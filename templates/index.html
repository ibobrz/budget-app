<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetWise — Personal Budget Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <h1>💰 BudgetWise</h1>
    <div class="month-picker">
      <label for="month">Month</label>
      <input type="month" id="month">
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card income"><h3>Income</h3><p id="sum-income">\$0.00</p></div>
      <div class="card expense"><h3>Expenses</h3><p id="sum-expenses">\$0.00</p></div>
      <div class="card"><h3>Balance</h3><p id="sum-balance">$0.00</p></div>
      <div class="card"><h3>Savings Rate</h3><p id="sum-savings">—</p></div>
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form id="tx-form" class="inline">
        <div class="field">
          <label for="tx-type">Type</label>
          <select id="tx-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="field">
          <label for="tx-amount">Amount</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="tx-category">Category</label>
          <select id="tx-category" required></select>
        </div>
        <div class="field">
          <label for="tx-date">Date</label>
          <input id="tx-date" type="date" required>
        </div>
        <div class="field grow">
          <label for="tx-desc">Description</label>
          <input id="tx-desc" type="text" maxlength="200" placeholder="Optional">
        </div>
        <button class="btn" type="submit">Add</button>
      </form>
    </section>

    <div class="grid-2">
      <section class="panel">
        <h2>Monthly Budgets</h2>
        <form id="budget-form" class="inline">
          <div class="field grow">
            <label for="budget-category">Expense category</label>
            <select id="budget-category" required></select>
          </div>
          <div class="field">
            <label for="budget-amount">Monthly limit</label>
            <input id="budget-amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <button class="btn" type="submit">Set</button>
        </form>
        <div id="budget-list"></div>
      </section>

      <section class="panel">
        <h2>Spending by Category</h2>
        <div id="cat-chart"></div>
      </section>
    </div>

    <section class="panel">
      <h2 id="tx-heading">Transactions</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Description</th><th>Category</th>
              <th>Type</th><th>Amount</th><th></th>
            </tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Manage Categories</h2>
      <form id="cat-form" class="inline">
        <div class="field grow">
          <label for="cat-name">Name</label>
          <input id="cat-name" type="text" maxlength="40" placeholder="e.g., Pets" required>
        </div>
        <div class="field">
          <label for="cat-type">Type</label>
          <select id="cat-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <button class="btn" type="submit">Add Category</button>
      </form>
      <div id="cat-list"></div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
